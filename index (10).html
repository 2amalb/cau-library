<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B2464">
<title>CAU Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2464;
  --navy-deep:#061539;
  --navy-soft:#12326F;
  --red:#E8412A;
  --red-dark:#C22E1A;
  --gold:#C9A227;
  --paper:#FAF9F6;
  --card:#FFFFFF;
  --ink:#14161C;
  --muted:#5F6473;
  --faint:#8D93A3;
  --line:#E6E4DE;
  --serif:'Newsreader',Georgia,serif;
  --sans:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
.hidden{display:none !important}
::selection{background:var(--navy);color:#fff}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ---------------------------------------------------------- sign in */
.gate{min-height:100dvh;display:grid;grid-template-columns:1fr 1fr}
.gate-art{
  background:var(--navy);position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(2rem,4vw,3.5rem);color:#fff;gap:2rem;
}
.gate-art .tile{position:absolute;inset:0;opacity:.55}
.gate-art .tile svg{width:100%;height:100%}
.gate-art>*:not(.tile){position:relative;z-index:1}
.gate-logo{height:44px;width:auto;display:block}
.gate-head{max-width:22ch}
.gate-head h1{
  font-family:var(--serif);font-weight:300;font-size:clamp(2.4rem,4.6vw,4rem);
  line-height:1.03;letter-spacing:-.02em;margin:0 0 1rem;
}
.gate-head h1 em{font-style:italic;color:#F0C651}
.gate-head p{margin:0;color:#B9C4E2;font-size:15px;max-width:34ch}
.gate-stats{display:flex;gap:2.5rem;border-top:1px solid rgba(255,255,255,.18);padding-top:1.25rem}
.gate-stats span{display:block;font-family:var(--serif);font-size:1.9rem;line-height:1}
.gate-stats small{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:#8FA0CC}

.gate-form{display:flex;align-items:center;justify-content:center;padding:2rem}
.form-inner{width:100%;max-width:352px}
.form-inner h2{font-family:var(--serif);font-weight:400;font-size:1.75rem;margin:0 0 .35rem;letter-spacing:-.01em}
.form-sub{color:var(--muted);font-size:14px;margin:0 0 1.75rem}
.field{display:block;margin-bottom:1rem}
.field span{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:.4rem;font-weight:600}
.field input{
  width:100%;height:46px;padding:0 14px;border:1px solid var(--line);border-radius:4px;
  background:#fff;color:var(--ink);transition:border-color .15s;
}
.field input:hover{border-color:#CFCCC4}
.field input:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px rgba(11,36,100,.09)}

.btn{
  width:100%;height:48px;border-radius:4px;background:var(--red);color:#fff;
  font-weight:600;transition:background .15s,transform .1s;
}
.btn:hover{background:var(--red-dark)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn-ghost{width:100%;height:40px;color:var(--muted);font-size:13.5px;margin-top:.4rem}
.btn-ghost:hover{color:var(--navy)}
.msg{font-size:13px;margin:0 0 1rem;padding:9px 12px;border-radius:4px}
.msg-bad{background:#FDECE9;color:#A32D1C}
.msg-ok{background:#EDF1FA;color:var(--navy)}

/* ------------------------------------------------------------ shell */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  border-bottom:1px solid rgba(255,255,255,.1)}
.top-in{max-width:1240px;margin:0 auto;padding:.85rem clamp(1rem,3vw,2rem);
  display:flex;align-items:center;gap:clamp(1rem,3vw,2.5rem)}
.brand{display:flex;align-items:center;gap:.85rem;flex-shrink:0}
.brand img{height:32px;width:auto}
.brand b{font-family:var(--serif);font-weight:300;font-size:1.15rem;
  padding-left:.85rem;border-left:1px solid rgba(255,255,255,.28)}
.searchbox{flex:1;position:relative;min-width:0}
.searchbox input{width:100%;height:40px;padding:0 14px 0 38px;border-radius:4px;
  border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.09);color:#fff}
.searchbox input::placeholder{color:#93A2C9}
.searchbox input:focus{outline:0;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.45)}
.searchbox svg{position:absolute;left:12px;top:11px;opacity:.6}
.top-acts{display:flex;align-items:center;gap:.35rem;flex-shrink:0}
.iconbtn{height:36px;padding:0 12px;border-radius:4px;font-size:13px;color:#C3CEE9;
  display:flex;align-items:center;gap:7px;transition:background .15s,color .15s}
.iconbtn:hover{background:rgba(255,255,255,.12);color:#fff}
.iconbtn.on{background:#fff;color:var(--navy);font-weight:600}

.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(1rem,3vw,2rem) 6rem}
.filters{display:flex;gap:.4rem;padding:1.4rem 0 1.1rem;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none}
.filters::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0;
  padding:7px 15px;border-radius:100px;font-size:13px;font-weight:500;
  border:1px solid var(--line);background:#fff;color:var(--muted);transition:all .15s}
.pill:hover{border-color:var(--navy);color:var(--navy)}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pip{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);flex-shrink:0}
.bar{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:1.2rem}
.tally{font-size:13px;color:var(--faint);margin:0}
.tally b{color:var(--ink);font-weight:600}

/* ------------------------------------------------------------- grid */
.grid{display:grid;gap:clamp(1rem,2vw,1.6rem);grid-template-columns:repeat(auto-fill,minmax(184px,1fr))}
.book{position:relative;cursor:pointer;text-align:left}
.jacket{position:relative;aspect-ratio:3/4;border-radius:3px;overflow:hidden;background:var(--navy);
  box-shadow:0 1px 2px rgba(20,22,28,.14),0 8px 22px -12px rgba(20,22,28,.4);
  transition:transform .28s cubic-bezier(.2,.7,.3,1),box-shadow .28s}
.book:hover .jacket{transform:translateY(-5px);
  box-shadow:0 2px 4px rgba(20,22,28,.16),0 20px 36px -16px rgba(20,22,28,.5)}
.jacket svg{position:absolute;inset:0;width:100%;height:100%}
.spine{position:absolute;left:0;top:0;bottom:0;width:8px;background:rgba(0,0,0,.22)}
.glint{position:absolute;left:8px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.28)}
.plate{position:absolute;left:11%;right:9%;bottom:9%;font-family:var(--serif);font-size:13.5px;
  line-height:1.28;color:#fff;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;
  overflow:hidden;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.info{padding:.75rem .1rem 0}
.info h3{font-family:var(--serif);font-weight:400;font-size:15.5px;line-height:1.3;margin:0 0 .2rem;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info p{margin:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .thin{margin-top:.3rem;font-size:11.5px;color:var(--faint)}
.mark{position:absolute;top:9px;right:9px;width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.92);color:var(--navy);display:grid;place-items:center;
  opacity:0;transform:scale(.9);transition:opacity .18s,transform .18s}
.book:hover .mark,.mark.on{opacity:1;transform:scale(1)}
.mark.on{background:var(--gold);color:#fff}

.blank{padding:5rem 1rem;text-align:center}
.blank h3{font-family:var(--serif);font-weight:400;font-size:1.4rem;margin:0 0 .4rem}
.blank p{color:var(--muted);margin:0;font-size:14px}
.pager{display:flex;align-items:center;justify-content:center;gap:1rem;padding:3rem 0 0}
.pager button{padding:9px 18px;border:1px solid var(--line);border-radius:4px;background:#fff;font-size:13.5px;font-weight:500}
.pager button:hover:not(:disabled){border-color:var(--navy);color:var(--navy)}
.pager button:disabled{opacity:.35;cursor:default}
.pager span{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}

/* ----------------------------------------------------------- detail */
.veil{position:fixed;inset:0;background:rgba(6,21,57,.6);backdrop-filter:blur(3px);z-index:30;
  display:grid;place-items:center;padding:1.25rem;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.panel{position:relative;background:var(--card);border-radius:6px;width:100%;max-width:820px;
  max-height:90dvh;overflow:auto;display:grid;grid-template-columns:300px 1fr;
  animation:rise .28s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.panel-art{position:relative;background:var(--navy);min-height:220px}
.panel-art svg{position:absolute;inset:0;width:100%;height:100%}
.panel-art .plate{font-size:19px;-webkit-line-clamp:5}
.panel-body{padding:clamp(1.5rem,3vw,2.25rem);display:flex;flex-direction:column;gap:1.15rem}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:700;margin:0}
.panel-body h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.5rem,3vw,2rem);
  line-height:1.18;margin:-.5rem 0 0;letter-spacing:-.015em}
.author{margin:0;color:var(--muted);font-size:14.5px}
.specs{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:.9rem;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:1.1rem 0}
.specs dt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 .2rem}
.specs dd{margin:0;font-size:14px;font-weight:500}
.quote{background:var(--paper);border-left:2px solid var(--gold);padding:.85rem 1rem;
  font-size:13px;color:var(--muted);line-height:1.55}
.quote strong{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:.35rem}
.quote i{font-family:var(--serif);font-size:14px}
.shut{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.9);color:var(--ink);display:grid;place-items:center;z-index:2}
.shut:hover{background:#fff}

/* ------------------------------------------------------- responsive */
@media(max-width:900px){
  .gate{grid-template-columns:1fr}
  .gate-art{min-height:auto;padding:1.75rem;gap:1.5rem}
  .gate-head h1{font-size:2.1rem}
  .gate-stats{gap:1.75rem}
  .panel{grid-template-columns:1fr;max-width:440px}
  .panel-art{aspect-ratio:16/10;min-height:0}
  .panel-art .plate{font-size:17px}
}
@media(max-width:720px){
  .top-in{flex-wrap:wrap;gap:.75rem .9rem;padding:.7rem 1rem}
  .searchbox{order:3;flex-basis:100%}
  .brand b{font-size:1rem}
  .top-acts{margin-left:auto}
  .iconbtn span{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1rem}
  .plate{font-size:11.5px;-webkit-line-clamp:3}
  .info h3{font-size:14px}
}
@media(max-width:400px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const SUPABASE_URL = 'https://dpebazpmhsbwmdzxacpu.supabase.co'
const SUPABASE_KEY = 'sb_publishable_0cu8v9o8W9c3UIeTf7sbUQ_XHIcRGQ_'
const WORKER_URL   = 'https://cau-library-download.bashirov-amal2.workers.dev'
const LOGO = 'https://static.tildacdn.net/tild6466-3739-4637-b464-666365313466/Group_2085665198.svg'

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)
const root = document.getElementById('root')
const PAGE = 24

const S = {
  session:null, schools:[], byId:{}, books:[], total:0, page:0,
  school:null, term:'', saved:new Set(), onlySaved:false,
  loading:true, open:null, mode:'in'
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))

/* --------------------------------------------------- cover artwork
   An eight-pointed khatam star on a tessellating grid — the motif
   that covers madrasa facades across the region. The tile is derived
   from the book's own id, so every volume carries a different one and
   always the same one.                                              */

function hash(str){
  let h = 2166136261
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) }
  return Math.abs(h)
}

function star(cx, cy, R, r, pts, rot){
  let d = ''
  for (let i = 0; i < pts * 2; i++){
    const rad = i % 2 ? r : R
    const a = (Math.PI / pts) * i + rot
    d += (i ? 'L' : 'M') + (cx + rad * Math.cos(a)).toFixed(2) + ' ' + (cy + rad * Math.sin(a)).toFixed(2)
  }
  return d + 'Z'
}

function artwork(seed, tint){
  const h = hash(String(seed))
  const T = [30, 38, 48][h % 3]
  const rot = [0, Math.PI / 8, Math.PI / 4][(h >> 3) % 3]
  const sw = [0.7, 0.95, 1.25][(h >> 6) % 3]
  const inner = [0.34, 0.42, 0.5][(h >> 9) % 3]
  const second = (h >> 12) % 2
  const spin = (h % 4) * 15
  const id = 'k' + (h % 99991)
  const R = T * 0.5
  return `<svg viewBox="0 0 200 267" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="g${id}" x1="0" y1="0" x2=".35" y2="1">
        <stop offset="0" stop-color="${tint}"/><stop offset="1" stop-color="#061539"/>
      </linearGradient>
      <pattern id="${id}" width="${T}" height="${T}" patternUnits="userSpaceOnUse" patternTransform="rotate(${spin})">
        <path d="${star(T/2, T/2, R, R*inner, 8, rot)}" fill="none" stroke="#fff" stroke-opacity=".34" stroke-width="${sw}"/>
        ${second ? `<path d="${star(T/2, T/2, R*.44, R*.16, 8, rot + Math.PI/8)}" fill="#fff" fill-opacity=".08"/>` : ''}
        <circle cx="0" cy="0" r="${sw*1.1}" fill="#fff" fill-opacity=".2"/>
        <circle cx="${T}" cy="0" r="${sw*1.1}" fill="#fff" fill-opacity=".2"/>
        <circle cx="0" cy="${T}" r="${sw*1.1}" fill="#fff" fill-opacity=".2"/>
        <circle cx="${T}" cy="${T}" r="${sw*1.1}" fill="#fff" fill-opacity=".2"/>
      </pattern>
    </defs>
    <rect width="200" height="267" fill="url(#g${id})"/>
    <rect width="200" height="267" fill="url(#${id})"/>
    <rect x="9" y="8" width="182" height="251" fill="none" stroke="#fff" stroke-opacity=".22"/>
  </svg>`
}

const I = {
  search:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  star:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  starOn:'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  out:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4h4v16h-4M11 8l-4 4 4 4M7 12h10"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>'
}

/* ---------------------------------------------------------- sign in */
function gate(bad = '', good = ''){
  const up = S.mode === 'up'
  root.innerHTML = `
  <div class="gate">
    <aside class="gate-art">
      <div class="tile">${artwork('cau-library-masthead', '#12326F')}</div>
      <img class="gate-logo" src="${LOGO}" alt="Central Asian University">
      <div class="gate-head">
        <h1>A library that <em>opens</em> at any hour</h1>
        <p>Every textbook your programme asks for, in one place, on whatever device you have with you.</p>
      </div>
      <div class="gate-stats">
        <div><span>201</span><small>Volumes</small></div>
        <div><span>8</span><small>Collections</small></div>
        <div><span>24/7</span><small>Open</small></div>
      </div>
    </aside>
    <main class="gate-form">
      <form class="form-inner" id="f">
        <h2>${up ? 'Create your account' : 'Sign in'}</h2>
        <p class="form-sub">Central Asian University accounts only.</p>
        ${bad ? `<p class="msg msg-bad">${esc(bad)}</p>` : ''}
        ${good ? `<p class="msg msg-ok">${esc(good)}</p>` : ''}
        ${up ? `<label class="field"><span>Full name</span><input name="name" required autocomplete="name"></label>` : ''}
        <label class="field"><span>University email</span>
          <input name="email" type="email" required autocomplete="email" placeholder="123456@centralasian.uz"></label>
        <label class="field"><span>Password</span>
          <input name="password" type="password" required minlength="8"
                 autocomplete="${up ? 'new-password' : 'current-password'}"></label>
        <button class="btn" id="go">${up ? 'Create account' : 'Sign in'}</button>
        <button type="button" class="btn-ghost" id="sw">
          ${up ? 'Already have an account? Sign in' : 'New here? Create an account'}</button>
      </form>
    </main>
  </div>`
  document.getElementById('sw').onclick = () => { S.mode = up ? 'in' : 'up'; gate() }
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault()
    const d = new FormData(e.target)
    const email = d.get('email'), password = d.get('password')
    const b = document.getElementById('go'); b.disabled = true; b.textContent = 'One moment'
    const { error } = up
      ? await supabase.auth.signUp({ email, password, options:{ data:{ full_name:d.get('name') } } })
      : await supabase.auth.signInWithPassword({ email, password })
    if (error) return gate(plain(error.message))
    if (up) gate('', `Confirmation sent to ${email}. Open it, then sign in.`)
  }
}

function plain(m){
  if (m.includes('Central Asian University')) return 'Use your @centralasian.uz address.'
  if (m.includes('Invalid login')) return 'That email and password do not match.'
  if (m.includes('already registered')) return 'This account exists already. Sign in instead.'
  if (m.includes('not confirmed')) return 'Confirm your email first, then sign in.'
  return m
}

/* ---------------------------------------------------------- catalog */
async function load(){
  S.loading = true; paint()
  let q = supabase.from('books')
    .select('id,title,authors,language,school_id,file_size,page_count,published_year',{count:'exact'})
  if (S.school) q = q.eq('school_id', S.school)
  if (S.term) q = q.or(`title.ilike.%${S.term}%,authors.ilike.%${S.term}%`)
  if (S.onlySaved){
    const ids = [...S.saved]
    q = q.in('id', ids.length ? ids : ['00000000-0000-0000-0000-000000000000'])
  }
  const { data, count } = await q.order('title').range(S.page * PAGE, S.page * PAGE + PAGE - 1)
  S.books = data || []; S.total = count || 0; S.loading = false
  paint()
}

function paint(){
  const pages = Math.ceil(S.total / PAGE)
  root.innerHTML = `
  <header class="top"><div class="top-in">
    <div class="brand"><img src="${LOGO}" alt="Central Asian University"><b>Library</b></div>
    <div class="searchbox">${I.search}
      <input id="q" placeholder="Search by title or author" value="${esc(S.term)}"></div>
    <div class="top-acts">
      <button class="iconbtn${S.onlySaved ? ' on' : ''}" data-saved>
        ${S.onlySaved ? I.starOn : I.star}<span>Saved${S.saved.size ? ' · ' + S.saved.size : ''}</span></button>
      <button class="iconbtn" data-out>${I.out}<span>Sign out</span></button>
    </div>
  </div></header>

  <div class="wrap">
    <nav class="filters">
      <button class="pill${S.school === null ? ' on' : ''}" data-s="">All collections</button>
      ${S.schools.map(x => `<button class="pill${S.school === x.id ? ' on' : ''}" data-s="${x.id}">
        <i class="pip" style="background:${esc(x.accent)}"></i>${esc(x.name.replace(' School',''))}</button>`).join('')}
    </nav>
    <div class="bar"><p class="tally">${
      S.loading ? 'Searching…'
      : S.total === 0 ? 'No matches'
      : `<b>${S.total}</b> ${S.total === 1 ? 'volume' : 'volumes'}`}</p></div>
    <div class="grid">${S.books.map(tile).join('')}</div>
    ${!S.loading && S.total === 0 ? `<div class="blank"><h3>Nothing on this shelf yet</h3>
      <p>Try a shorter search, or ask the library team to add the book.</p></div>` : ''}
    ${pages > 1 ? `<nav class="pager">
      <button data-p="${S.page - 1}" ${S.page === 0 ? 'disabled' : ''}>Previous</button>
      <span>${S.page + 1} / ${pages}</span>
      <button data-p="${S.page + 1}" ${S.page + 1 >= pages ? 'disabled' : ''}>Next</button></nav>` : ''}
  </div>
  ${S.open ? panel(S.open) : ''}`
  wire()
}

function tile(b){
  const sc = S.byId[b.school_id] || {}
  const on = S.saved.has(b.id)
  const bits = [
    b.page_count ? b.page_count + ' pp' : 'PDF',
    b.published_year || null,
    b.language !== 'en' ? b.language.toUpperCase() : null
  ].filter(Boolean).join('  ·  ')
  return `<article class="book" data-open="${b.id}">
    <div class="jacket">${artwork(b.id, sc.accent || '#12326F')}
      <i class="spine"></i><i class="glint"></i>
      <div class="plate">${esc(b.title)}</div></div>
    <div class="info">
      <h3>${esc(b.title)}</h3>
      <p>${esc(b.authors || sc.name || '')}</p>
      <p class="thin">${esc(bits)}</p></div>
    <button class="mark${on ? ' on' : ''}" data-save="${b.id}"
      aria-label="${on ? 'Remove from saved' : 'Save this book'}">${on ? I.starOn : I.star}</button>
  </article>`
}

function panel(b){
  const sc = S.byId[b.school_id] || {}
  const langs = { en:'English', ru:'Russian', uz:'Uzbek' }
  return `<div class="veil" data-close><div class="panel">
    <button class="shut" data-close aria-label="Close">${I.x}</button>
    <div class="panel-art">${artwork(b.id, sc.accent || '#12326F')}<div class="plate">${esc(b.title)}</div></div>
    <div class="panel-body">
      <p class="eyebrow">${esc(sc.name || '')}</p>
      <h2>${esc(b.title)}</h2>
      ${b.authors ? `<p class="author">${esc(b.authors)}</p>` : ''}
      <dl class="specs">
        ${b.published_year ? `<div><dt>Published</dt><dd>${b.published_year}</dd></div>` : ''}
        ${b.page_count ? `<div><dt>Extent</dt><dd>${b.page_count} pages</dd></div>` : ''}
        <div><dt>Format</dt><dd>PDF · ${(b.file_size / 1048576).toFixed(0)} MB</dd></div>
        <div><dt>Language</dt><dd>${langs[b.language] || b.language}</dd></div>
      </dl>
      <button class="btn" data-dl="${b.id}">Open the book</button>
      <p class="msg msg-bad hidden" id="err"></p>
      <div class="quote"><strong>Cite this</strong>${b.authors ? esc(b.authors) + '. ' : ''}<i>${esc(b.title)}</i>${
        b.published_year ? ', ' + b.published_year : ''}. Central Asian University Library.</div>
    </div>
  </div></div>`
}

/* ----------------------------------------------------------- events */
let t
function wire(){
  const q = document.getElementById('q')
  if (q) q.oninput = () => { clearTimeout(t); t = setTimeout(() => {
    S.term = q.value.trim(); S.page = 0; load() }, 260) }
  document.querySelectorAll('[data-s]').forEach(el => el.onclick = () => {
    S.school = el.dataset.s ? Number(el.dataset.s) : null; S.page = 0; load() })
  document.querySelectorAll('[data-p]').forEach(el => el.onclick = () => {
    S.page = Number(el.dataset.p); load(); window.scrollTo({ top:0, behavior:'smooth' }) })
  const sv = document.querySelector('[data-saved]')
  if (sv) sv.onclick = () => { S.onlySaved = !S.onlySaved; S.page = 0; load() }
  const out = document.querySelector('[data-out]')
  if (out) out.onclick = () => supabase.auth.signOut()

  document.querySelectorAll('[data-save]').forEach(el => el.onclick = async e => {
    e.stopPropagation()
    const id = el.dataset.save
    if (S.saved.has(id)){
      S.saved.delete(id)
      await supabase.from('bookmarks').delete().eq('book_id', id).eq('user_id', S.session.user.id)
    } else {
      S.saved.add(id)
      await supabase.from('bookmarks').insert({ book_id:id, user_id:S.session.user.id })
    }
    paint()
  })
  document.querySelectorAll('[data-open]').forEach(el => el.onclick = () => {
    S.open = S.books.find(b => b.id === el.dataset.open); paint() })
  document.querySelectorAll('[data-close]').forEach(el => el.onclick = e => {
    if (e.currentTarget === e.target || e.currentTarget.classList.contains('shut')){ S.open = null; paint() } })
  const dl = document.querySelector('[data-dl]')
  if (dl) dl.onclick = () => reveal(dl)
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.open){ S.open = null; paint() } })

async function reveal(btn){
  const err = document.getElementById('err')
  err.classList.add('hidden')
  const tab = window.open('', '_blank')
  btn.disabled = true; btn.textContent = 'Preparing…'
  try {
    const { data:{ session } } = await supabase.auth.getSession()
    const r = await fetch(WORKER_URL.replace(/\/$/,'') + '/ticket', {
      method:'POST',
      headers:{ Authorization:'Bearer ' + session.access_token, 'Content-Type':'application/json' },
      body: JSON.stringify({ book_id: btn.dataset.dl })
    })
    const out = await r.json()
    if (!r.ok || !out.ticket) throw new Error(out.error || 'no ticket')
    tab.location = WORKER_URL.replace(/\/$/,'') + '/file?t=' + encodeURIComponent(out.ticket)
  } catch (e){
    if (tab) tab.close()
    err.textContent = 'That file would not open. Try once more in a moment.'
    err.classList.remove('hidden')
  }
  btn.disabled = false; btn.textContent = 'Open the book'
}

/* ------------------------------------------------------------- boot */
async function start(session){
  S.session = session
  const [{ data:schools }, { data:marks }] = await Promise.all([
    supabase.from('schools').select('*').order('sort_order'),
    supabase.from('bookmarks').select('book_id')
  ])
  S.schools = schools || []
  S.byId = Object.fromEntries(S.schools.map(x => [x.id, x]))
  S.saved = new Set((marks || []).map(m => m.book_id))
  load()
}

const { data:{ session } } = await supabase.auth.getSession()
session ? start(session) : gate()
supabase.auth.onAuthStateChange((_e, s) => {
  if (s && !S.session) start(s)
  if (!s){ S.session = null; gate() }
})
</script>
